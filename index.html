<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PicGrid — Discover High-Res Visuals</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="logo">
      <h1>PicGrid</h1>
      <p class="tagline">Explore millions of free, high-resolution images instantly.</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    <!-- Search Form -->
    <form id="search-form" class="search-box">
      <div class="input-wrapper">
        <label for="search-input" class="visually-hidden">Search images</label>
        <input 
          type="search" 
          id="search-input" 
          placeholder="Try 'mountains', 'neon', or 'architecture'..." 
          required 
        />
      </div>
      <button type="submit" id="search-btn">Search</button>
    </form>

    <!-- Extra Feature 1: Category Quick-Pick Chips -->
    <div class="category-chips">
      <span class="chip-label">Popular:</span>
      <button class="chip" type="button">Nature</button>
      <button class="chip" type="button">Architecture</button>
      <button class="chip" type="button">Minimal</button>
      <button class="chip" type="button">Abstract</button>
    </div>

    <!-- Extra Feature 2: Result Count / Empty State Message -->
    <div id="status-bar" class="status-bar">
      <p id="empty-state">Search for a topic above to start exploring images.</p>
    </div>

    <!-- Results Grid Container -->
    <section id="gallery-results" class="gallery-grid"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
